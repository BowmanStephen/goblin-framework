name: Generate TRICKLE BOT Banner

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install Pillow

      - name: Generate banner
        run: python3 tools/trickle_bot_banner.py
        env:
          OUT_DIR: .

      - name: Commit outputs
        run: |
          git config user.name "Hermes Agent"
          git config user.email "hermes@bowman.dev"
          git add trickle_bot_banner.png trickle_bot_banner_3x.png
          git commit -m "art: regenerate TRICKLE BOT banner [skip ci]" || echo "No changes"
          git push
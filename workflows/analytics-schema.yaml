# Analytics Event Schema Design (Workflow v0.2)

# Stresses ambiguity, over-production, and scope creep.
# No clear source of truth. Easy to over-instrument. Privacy risk.
# v0.2: Skeptic revisions — pseudonymous data, configurable steps, derived metrics, property review

name: analytics-schema
description: "Design an analytics event schema for a consumer app. Stresses ambiguity, over-production, and scope creep."

offering:
  task: "Design an analytics event schema for a consumer mobile app. There is no existing schema — this is new. The product team wants to track user engagement, funnel conversion, and retention. There is currently no analytics infrastructure and no shared vocabulary for events."

  territory: "Analytics event schema definition, property naming conventions, event taxonomy"

  permissions:
    - define_event_names
    - define_event_properties
    - suggest_naming_conventions
    - identify_ambiguity_in_requirements

  constraints:
    - "Events must be pseudonymous — no raw user identifiers in event payloads"
    - "Must not assume specific analytics vendor or SDK"
    - "Schema should cover core funnel: app_open → session_start → content_view → action → session_end"
    - "Property names must use snake_case"
    - "Must flag any assumption about user identity or session model"

  do_not_do:
    - implement_tracking_code
    - define_backend_api_endpoints
    - design_database_schema
    - prescribe_vendor_specific_implementation
    - collect_or_transmit_user_data

  success_criteria:
    - "Schema covers core funnel without over-instrumenting"
    - "Every event has a clear purpose and is actionable"
    - "Privacy constraints are respected — no PII in schema"
    - "Naming is consistent and follows snake_case convention"

  budget:
    max_tokens: 5000
    max_time: 15m

  risk_level: medium

  approval_required:
    - publish_schema_to_team
    - modify_existing_event_definitions

  stakeholders:
    - product_team
    - engineering
    - privacy

  output_format:
    type: structured
    schema:
      - event_name: string
        description: string
        properties: list
        purpose: string

scope_enforcement:
  approved_scope:
    - define_event_names
    - define_event_properties
    - suggest_naming_conventions
    - identify_ambiguity_in_requirements

  blocked_scope:
    - implement_tracking_code
    - define_backend_api_endpoints
    - design_database_schema
    - prescribe_vendor_specific_implementation
    - collect_or_transmit_user_data
    - deploy_to_production
    - modify_existing_systems_outside_territory

steps:
  - goblin: scout
    name: scout-context
    description: "Gather context on analytics requirements, identify gaps and ambiguities"

  - goblin: steward
    name: steward-gate-1
    description: "Verify Scout stayed within territory — schema definition only, not implementation"

  - goblin: tinker
    name: tinker-design
    description: "Produce the analytics event schema for the core funnel"
    expected_output:
      type: structured
      contains:
        - event_names
        - property_definitions
        - naming_conventions

  - goblin: steward
    name: steward-gate-2
    description: "Verify Tinker stayed within approved scope — schema only, no code or implementation"

  - goblin: skeptic
    name: skeptic-review
    description: "Review for over-instrumentation, privacy violations, and missing edge cases"
    focus_areas:
      - over_production
      - privacy_violations
      - ambiguous_definitions
      - naming_inconsistency

  - goblin: steward
    name: steward-final
    description: "Final enforcement gate before ledger"

  - goblin: ledger
    name: ledger-write
    description: "Write the run ledger"

grudge_book:
  - title: "premature execution in design mode"
    what_went_wrong: "Tinker started writing implementation code when the task was design-only"
    should_have_been: "Stop at schema definition. Do not write code."
    detection: "Implementation code appearing in design output"
    severity: critical

  - title: "ambiguous requirements passthrough"
    what_went_wrong: "Scout passed through ambiguous requirements without flagging them"
    should_have_been: "Flag every ambiguity explicitly. Never assume the next goblin will catch it."
    detection: "Unflagged ambiguous terms like 'user engagement' appearing in context without clarification"
    severity: high
# Grudge Book (v0.1)

# A grudge is a recorded failure with instructions to avoid repeating it.
# Grudges are loaded into goblin context to prevent recurring mistakes.

- title: "Premature repository push from design mode"
  what_failed: "Agent initialized, committed, and attempted to push repo changes before review"
  why_it_failed: "The request was interpreted as execution instead of design"
  detection: "Any git init, commit, push, deploy, or external action before explicit approval"
  prevention: "Require Steward approval before irreversible or external actions"
  source: "Goblin Framework first repo build session"
  date: "2026-04-30"
  expires: never

- title: "Tinker over-production on ambiguous tasks"
  what_failed: "Tinker defined a full event schema when only a minimal viable set was needed"
  why_it_failed: "No minimality constraint and no negative scope in the offering packet"
  detection: "Any time Tinker produces more elements than the task explicitly requires, especially on ambiguous tasks with no source of truth"
  prevention: "Add minimality constraint to Tinker: prefer minimal viable output over complete coverage. Add do_not_do field to offering packet. Require decision_supported mapping for every element"
  source: "Onboarding analytics schema design run"
  date: "2026-04-30"
  expires: never

- title: "Pseudonymous data classified as anonymous"
  what_failed: "Schema used hashed user_id treated as anonymous data when it is actually pseudonymous and potentially linkable"
  why_it_failed: "Assumption that hashing removes identifiability — it does not, depending on generation and storage"
  detection: "Any identifier that can be linked back to a person, even through hashing, is pseudonymous not anonymous"
  prevention: "All identifiers must include privacy_classification field. Hashed IDs must be labeled pseudonymous, never anonymous. Require privacy/legal review for any identifier usage"
  source: "Onboarding analytics schema Skeptic review"
  date: "2026-04-30"
  expires: never